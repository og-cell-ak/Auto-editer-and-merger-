name: Build Editor and Merger
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - name: Five-pass code verification
        run: |
          for i in 1 2 3 4 5; do
            echo "CODE VERIFICATION PASS $i"
            python3 -m py_compile tools/validate_project.py
            python3 tools/validate_project.py
            gradle --no-daemon test
          done
      - name: Create CI signing key
        run: |
          keytool -genkeypair -v -keystore app/ci-release.p12 -storetype PKCS12 -alias ai-universal-auto-editor-pro -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname "CN=Editor and Merger, OU=Mobile, O=Personal, L=India, ST=Haryana, C=IN"
      - name: Build signed release APK
        run: |
          gradle --no-daemon --stacktrace test assembleRelease             -PreleaseKeystore=app/ci-release.p12             -PreleaseStorePassword=changeit             -PreleaseKeyAlias=ai-universal-auto-editor-pro             -PreleaseKeyPassword=changeit
      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -tq "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-and-merger-final
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
